# ─────────────────────────────────────────────────────────────────────────────
# CampusFlow — Render Blueprint
# Spec: https://render.com/docs/blueprint-spec
#
# Provisions (all in the same region so traffic stays on the private network):
#   - campusflow-backend : NestJS API (Docker, backend/Dockerfile)
#   - campusflow-db      : Render Postgres
#   - campusflow-kv      : Render Key Value (Valkey) for BullMQ + Socket.IO adapter
#
# Free-plan caveats:
#   - Free Postgres expires 30 days after creation (14-day grace to upgrade,
#     then it is deleted). Use a paid plan (e.g. basic-256mb) for anything lasting.
#   - Free Key Value has no persistence (data lost on restart; queued jobs too)
#     and a 25 MB / 50-connection limit.
#   - Free web services spin down after 15 min idle (~1 min cold start).
#
# Secrets marked `sync: false` are prompted for once, when the Blueprint is
# first created. JWT secrets must be >= 64 chars (Joi), so `generateValue: true`
# (a 44-char base64 value) cannot be used. Generate with: openssl rand -hex 64
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: campusflow-backend
    runtime: docker
    plan: free
    region: oregon
    # Paths are relative to the repo root (no rootDir set)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # The image CMD runs `prisma migrate deploy` (pinned 5.22.0) then starts the app
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
      ignoredPaths:
        - backend/api-tests/**
        - backend/**/*.md
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is injected by Render (default 10000); the app reads it.
      - key: DATABASE_URL
        fromDatabase:
          name: campusflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: campusflow-kv
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Comma-separated frontend origins, e.g. https://campusflow-six-chi.vercel.app
      - key: CORS_ORIGINS
        sync: false

  - type: keyvalue
    name: campusflow-kv
    plan: free
    region: oregon
    # BullMQ requires noeviction (evicting keys silently corrupts queues)
    maxmemoryPolicy: noeviction
    # Internal connections only (private network)
    ipAllowList: []

databases:
  - name: campusflow-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: campusflow
    user: campusflow
    # Internal connections only. Add your IP here to use psql / Prisma Studio
    # from your machine.
    ipAllowList: []
